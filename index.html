<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16302c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deficit">
<title>Deficit</title>
<style>
:root{--bg:#edf2ef;--card:#fff;--ink:#16302c;--mute:#6b7f7a;--line:#d5e0dc;--acc:#2447f5;--pro:#e0a100;--ok:#1f9d6b;--bad:#c93b3b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#172623;--ink:#e6f0ed;--mute:#8aa19b;--line:#27403b;--acc:#6f8bff;--pro:#f2bd2c;--ok:#3fcf94;--bad:#ff7a7a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 84px);max-width:560px;margin:0 auto}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.big small{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0;margin-left:4px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.p i{background:var(--pro)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
button,.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;text-align:center}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.full,.btn.full{width:100%}
.x{background:none;color:var(--mute);padding:4px 8px;font-size:20px}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item b{font-weight:600}
.item span{color:var(--mute);font-size:14px}
.ck{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border:0}
.ck input{width:24px;height:24px;margin:0}
.ck.d div{text-decoration:line-through;color:var(--mute)}
.ck span{display:block;color:var(--mute);font-size:13px}
.msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;white-space:pre-wrap;font-size:15px}
.msg.u{background:var(--acc);color:#fff;margin-left:30px}
.msg.a{background:var(--bg);border:1px solid var(--line);margin-right:20px}
.err{color:var(--bad);font-size:14px;margin:6px 0}
.note{color:var(--mute);font-size:13px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-size:14px}
#nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main id="v"></main>
<nav id="nav">
<button data-t="today">Today</button>
<button data-t="workout">Workout</button>
<button data-t="coach">Coach</button>
<button data-t="hist">History</button>
<button data-t="me">Me</button>
</nav>
<script>
var $=function(s){return document.querySelector(s)}
var KEY='deficit_v1'
var VER=6
var S=(function(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}})()
S.set=S.set||{key:'',model:'claude-sonnet-5-5',kcal:1800,prot:100}
S.meals=S.meals||{};S.wk=S.wk||{};S.wt=S.wt||[];S.chat=S.chat||[];S.ui=S.ui||{}
var save=function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var pad=function(n){return String(n).padStart(2,'0')}
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var fmt=function(n){return Number(n||0).toLocaleString('en-US')}
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tab='today',pending=null,busy='',errTxt='',draft='',recOpen=false,editW=false,editM=-1
var SLOTS=['Breakfast','Lunch','Dinner','Snack']
var guess=function(){var h=new Date().getHours();return h>=5&&h<10?0:h>=10&&h<15?1:h>=15&&h<21?2:3}
var slot=SLOTS[guess()]
var FOODSYS='You estimate calories and macros for foods, mostly Filipino and common store-bought items. Reply with JSON only, no markdown: {"items":[{"name":"","kcal":0,"protein":0,"carbs":0,"fat":0}],"note":""}. Split the meal into separate items when it has several foods. Use a normal serving size if the amount is not given. Rice is about 200 kcal per cup. note is one short tip or empty.'

var EX=[['Warm-up march in place','3 min'],['Squats','3 x 12'],['Wall or knee push-ups','3 x 8-12'],['Reverse lunges','3 x 8 each leg'],['Slow mountain climbers','3 x 30 sec'],['Step jacks (no jumping)','3 x 40 sec'],['Plank','3 x 20-30 sec'],['Cool-down stretch','2 min']]
var PLAN=['Walk 45 min','Workout','Walk 30 min','Rest day','Workout','Walk 30 min','Workout']
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
S.ex=S.ex||EX.map(function(e){return {n:e[0],d:e[1]}})
S.plan=S.plan||PLAN.slice()
S.walk=S.walk||{}
if(S.exv!==2){S.ex=EX.map(function(e){return {n:e[0],d:e[1]}});S.plan=PLAN.slice();S.exv=2;save()}
if(S.wd==null){S.wd=6}

function totals(){
 var m=S.meals[today()]||[],k=0,p=0,c=0,f=0
 m.forEach(function(x){k+=+x.k||0;p+=+x.p||0;c+=+x.c||0;f+=+x.f||0})
 return {k:k,p:p,c:c,f:f,n:m.length}
}

function ask(content,sys,hist){
 if(!S.set.key){return Promise.reject(new Error('Paste your API key in the Me tab first.'))}
 var msgs=(hist||[]).concat([{role:'user',content:content}])
 return fetch('https://api.anthropic.com/v1/messages',{
  method:'POST',
  headers:{'content-type':'application/json','x-api-key':S.set.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model:S.set.model,max_tokens:1000,system:sys,messages:msgs})
 }).then(function(r){return r.json().then(function(j){
  if(!r.ok){throw new Error(j.error&&j.error.message||'Request failed')}
  return j.content.filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('')
 })})
}

function shrink(file){
 return new Promise(function(res,rej){
  var fr=new FileReader()
  fr.onerror=function(){rej(new Error('Could not read photo'))}
  fr.onload=function(){
   var im=new Image()
   im.onerror=function(){rej(new Error('Could not open photo'))}
   im.onload=function(){
    var m=1024,s=Math.min(1,m/Math.max(im.width,im.height))
    var c=document.createElement('canvas')
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s)
    c.getContext('2d').drawImage(im,0,0,c.width,c.height)
    res(c.toDataURL('image/jpeg',0.8).split(',')[1])
   }
   im.src=fr.result
  }
  fr.readAsDataURL(file)
 })
}

function est(content){
 return ask(content,FOODSYS).then(function(t){
  var j=JSON.parse(t.replace(/```json|```/g,'').trim())
  if(!j.items||!j.items.length){throw new Error('Could not read that. Try describing it differently.')}
  return j
 })
}

function logText(){
 var q=draft.trim()
 if(!q||busy){return}
 busy='Working out calories...';errTxt='';pending=null;draw()
 est(q).then(function(j){pending=j;busy='';draft=''}).catch(function(e){busy='';errTxt=e.message}).then(draw)
}

function scan(inp){
 var f=inp.files&&inp.files[0]
 if(!f){return}
 busy='Reading your plate...';errTxt='';pending=null;draw()
 shrink(f).then(function(b64){
  return est([{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:draft||'Estimate this meal.'}])
 }).then(function(j){pending=j;busy='';draft=''}).catch(function(e){busy='';errTxt=e.message}).then(draw)
}

function addPending(){
 if(!pending){return}
 var d=today();S.meals[d]=S.meals[d]||[]
 pending.items.forEach(function(i){S.meals[d].push({n:i.name,k:Math.round(i.kcal)||0,p:Math.round(i.protein)||0,c:Math.round(i.carbs)||0,f:Math.round(i.fat)||0,s:slot})})
 pending=null;save();draw()
}
function delMeal(i){S.meals[today()].splice(i,1);editM=-1;save();draw()}
function setSlot(i){slot=SLOTS[i];draw()}
function recent(){
 var seen={},out=[],ds=Object.keys(S.meals).sort().reverse()
 ds.forEach(function(d){S.meals[d].slice().reverse().forEach(function(m){
  var key=m.n.toLowerCase()
  if(!seen[key]&&out.length<8){seen[key]=1;out.push(m)}
 })})
 return out
}
function reAdd(i){
 var m=recent()[i],d=today()
 S.meals[d]=S.meals[d]||[]
 S.meals[d].push({n:m.n,k:m.k,p:m.p,c:m.c||0,f:m.f||0,s:slot});save();draw()
}

function tick(i,on){
 var d=today();S.wk[d]=S.wk[d]||[]
 var a=S.wk[d],at=a.indexOf(i)
 if(on&&at<0){a.push(i)}
 if(!on&&at>-1){a.splice(at,1)}
 save();draw()
}
function streak(){
 var n=0,d=new Date()
 for(var i=0;i<60;i++){
  var k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
  var done=(S.wk[k]||[]).length>=S.ex.length
  if(done){n++}else if(i>0){break}
  d.setDate(d.getDate()-1)
 }
 return n
}

function copyBackup(){
 var t=JSON.stringify(S)
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){errTxt='Copied.';draw()}).catch(function(){errTxt='Copy failed.';draw()})}
}
function restoreBackup(){
 try{
  var d=JSON.parse($('#bk').value)
  S=d;save();location.reload()
 }catch(e){errTxt='That is not a valid backup.';draw()}
}

function editForm(m,i){
 var opts=SLOTS.map(function(x){return '<option'+(x===(m.s||'Snack')?' selected':'')+'>'+x+'</option>'}).join('')
 return '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><input id="en_n" value="'+esc(m.n)+'"><div class="row"><input id="en_k" type="number" inputmode="numeric" value="'+(m.k||0)+'" placeholder="kcal"><input id="en_p" type="number" inputmode="numeric" value="'+(m.p||0)+'" placeholder="protein"></div><div class="row"><input id="en_c" type="number" inputmode="numeric" value="'+(m.c||0)+'" placeholder="carbs"><input id="en_f" type="number" inputmode="numeric" value="'+(m.f||0)+'" placeholder="fat"></div><select id="en_s">'+opts+'</select><div class="row"><button class="full" onclick="saveM('+i+')">Save</button><button class="sec" onclick="editM=-1;draw()">Cancel</button></div></div>'
}
function startEditM(i){editM=i;draw()}
function saveM(i){
 var m=S.meals[today()][i]
 m.n=$('#en_n').value.trim()||m.n
 m.k=Math.round(+$('#en_k').value)||0
 m.p=Math.round(+$('#en_p').value)||0
 m.c=Math.round(+$('#en_c').value)||0
 m.f=Math.round(+$('#en_f').value)||0
 m.s=$('#en_s').value
 editM=-1;save();draw()
}


function vHist(){
 var d=new Date(),out='',days=0,sum=0
 for(var i=0;i<14;i++){
  var k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
  var m=S.meals[k]||[],kc=0,pr=0
  m.forEach(function(x){kc+=+x.k||0;pr+=+x.p||0})
  var wn=(S.wk[k]||[]).length,wl=S.walk[k]||0
  var wt=S.wt.filter(function(x){return x.d===k})[0]
  if(m.length||wn||wl||wt){
   if(i<7&&m.length){days++;sum+=kc}
   var label=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
   var body=''
   SLOTS.forEach(function(sl){
    var it=m.filter(function(x){return (x.s||'Snack')===sl})
    if(it.length){body+='<div class="note" style="margin-top:6px"><b>'+sl+'</b></div>'+it.map(function(x){return '<div class="item"><b>'+esc(x.n)+'</b><span>'+fmt(x.k)+' kcal</span></div>'}).join('')}
   })
   body+='<p class="note" style="margin-top:8px">Protein '+fmt(pr)+' g &middot; Workout '+wn+'/'+S.ex.length+' &middot; Walk '+wl+' min'+(wt?' &middot; Weight '+wt.v+' kg':'')+'</p>'
   var col=!kc?'var(--mute)':kc>S.set.kcal?'var(--bad)':'var(--ok)'
   out+='<details class="card"><summary><b>'+label+'</b><span style="float:right;color:'+col+'">'+fmt(kc)+' kcal</span></summary><div style="margin-top:8px">'+body+'</div></details>'
  }
  d.setDate(d.getDate()-1)
 }
 return '<h1>History</h1><div class="sub">'+(days?'7-day average: '+fmt(Math.round(sum/days))+' kcal ('+days+' day'+(days>1?'s':'')+' logged)':'Last 14 days')+'</div>'+(out||'<div class="card note">Nothing logged yet.</div>')
}

function weightChart(){
 var pts=S.wt.slice(-12)
 if(pts.length<2){return ''}
 var vs=pts.map(function(x){return x.v}),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs)
 if(hi===lo){hi=lo+1}
 var W=300,H=110,px=30,py=18
 var xy=pts.map(function(x,i){return [px+(W-2*px)*i/(pts.length-1),H-py-(H-2*py)*(x.v-lo)/(hi-lo)]})
 var line=xy.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}).join(' ')
 var dots=xy.map(function(a){return '<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="3.5" style="fill:var(--acc)"/>'}).join('')
 var diff=pts[pts.length-1].v-pts[0].v
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin:6px 0"><polyline points="'+line+'" style="fill:none;stroke:var(--acc);stroke-width:2.5"/>'+dots+'<text x="4" y="14" font-size="11" style="fill:var(--mute)">'+hi+'</text><text x="4" y="'+(H-4)+'" font-size="11" style="fill:var(--mute)">'+lo+'</text></svg><div class="note" style="margin-bottom:8px">'+pts[0].d+' to '+pts[pts.length-1].d+': '+(diff>0?'+':'')+diff.toFixed(1)+' kg</div>'
}

function logWeight(){
 var v=parseFloat($('#wv').value)
 if(!v){return}
 var d=today()
 S.wt=S.wt.filter(function(x){return x.d!==d})
 S.wt.push({d:d,v:v});S.wt.sort(function(a,b){return a.d<b.d?-1:1})
 save();draw()
}
function saveSet(){
 S.set.key=$('#sk').value.trim()
 S.set.model=$('#sm').value.trim()||'claude-sonnet-5-5'
 S.set.kcal=+$('#sc').value||1800
 S.wd=+$('#sw').value
 S.set.prot=+$('#sp').value||100
 save();errTxt='Saved.';draw()
}

function sendCoach(){
 var el=$('#q'),q=el.value.trim()
 if(!q||busy){return}
 var t=totals(),last=S.wt.slice(-5).map(function(x){return x.d+': '+x.v+'kg'}).join(', ')
 var sys='You are a practical weight-loss coach for Nico, 34, male, 5\'5", works night shift 11PM-7AM Mon-Fri, does bodyweight workouts of 20-30 min. Eats rice with chicken, pork or beef, usually lunch and dinner. Daily target '+S.set.kcal+' kcal and '+S.set.prot+' g protein. Today so far: '+t.k+' kcal, '+t.p+' g protein. Recent weights: '+(last||'none')+'. Workout today: '+(S.wk[today()]||[]).length+'/'+S.ex.length+' done. Walked '+(S.walk[today()]||0)+' min today. Plan: '+S.plan[new Date().getDay()]+'. Be short, specific, Taglish is fine. If asked to plan meals, use Filipino food. No medical diagnosis; for medication questions tell them to see a clinician.'
 var hist=S.chat.slice(-8).map(function(m){return {role:m.r,content:m.t}})
 S.chat.push({r:'user',t:q});el.value='';busy='Thinking...';errTxt='';draw()
 ask(q,sys,hist).then(function(a){S.chat.push({r:'assistant',t:a});save()}).catch(function(e){errTxt=e.message;S.chat.pop()}).then(function(){busy='';draw()})
}
function clearChat(){S.chat=[];save();draw()}

function vToday(){
 var t=totals(),left=S.set.kcal-t.k,pk=Math.min(100,t.k/S.set.kcal*100),pp=Math.min(100,t.p/S.set.prot*100)
 var all=S.meals[today()]||[]
 var diary=SLOTS.map(function(s){
  var rows='',sk=0,cnt=0
  all.forEach(function(m,i){
   if((m.s||'Snack')!==s){return}
   sk+=+m.k||0;cnt++
   if(i===editM){rows+=editForm(m,i);return}
   rows+='<div class="item"><div onclick="startEditM('+i+')" style="flex:1"><b>'+esc(m.n)+'</b><br><span>'+fmt(m.k)+' kcal &middot; P '+m.p+' &middot; C '+(m.c||0)+' &middot; F '+(m.f||0)+'</span></div><button class="x" onclick="delMeal('+i+')">&times;</button></div>'
  })
  var op=S.ui[s]===undefined?s===slot:S.ui[s]
  return '<details class="card"'+(op?' open':'')+' ontoggle="S.ui.'+s+'=this.open;save()"><summary><b>'+s+'</b><span class="note" style="float:right">'+fmt(sk)+' kcal'+(cnt?' &middot; '+cnt+' item'+(cnt>1?'s':''):'')+'</span></summary><div style="margin-top:8px">'+(rows||'<div class="note">Nothing yet.</div>')+'</div></details>'
 }).join('')
 var chips=SLOTS.map(function(s,i){
  return '<button class="'+(s===slot?'':'sec')+'" style="padding:8px 12px;font-size:14px;margin:0 6px 8px 0" onclick="setSlot('+i+')">'+s+'</button>'
 }).join('')
 var pend=''
 if(pending){
  pend='<div class="card"><h2>AI estimate</h2>'+pending.items.map(function(i){return '<div class="item"><div><b>'+esc(i.name)+'</b><br><span>P '+Math.round(i.protein)+' &middot; C '+Math.round(i.carbs||0)+' &middot; F '+Math.round(i.fat||0)+'</span></div><b>'+fmt(Math.round(i.kcal))+' kcal</b></div>'}).join('')+(pending.note?'<p class="note">'+esc(pending.note)+'</p>':'')+'<div class="row"><button class="full" onclick="addPending()">Add to '+slot+'</button><button class="sec" onclick="pending=null;draw()">Skip</button></div></div>'
 }
 var rec=recent().map(function(m,i){
  return '<div class="item" onclick="reAdd('+i+')"><div><b>'+esc(m.n)+'</b><br><span>'+fmt(m.k)+' kcal &middot; P '+m.p+'</span></div><b style="color:var(--acc)">+ '+slot+'</b></div>'
 }).join('')
 return '<h1>'+DAYS[new Date().getDay()]+'</h1><div class="sub">'+today()+'</div>'+weighBanner()+
 '<div class="card"><div class="big" style="color:'+(left<0?'var(--bad)':'var(--ink)')+'">'+fmt(Math.abs(left))+'<small>kcal '+(left<0?'over':'left')+'</small></div>'+
 '<div class="bar"><i style="width:'+pk+'%"></i></div><div class="note">'+fmt(t.k)+' of '+fmt(S.set.kcal)+' kcal</div>'+
 '<div class="bar p"><i style="width:'+pp+'%"></i></div><div class="note">Protein '+fmt(t.p)+' of '+fmt(S.set.prot)+' g &middot; Carbs '+fmt(t.c)+' g &middot; Fat '+fmt(t.f)+' g</div></div>'+
 '<div class="card"><h2>Log food</h2><div>'+chips+'</div>'+
 '<div class="row"><input id="ft" value="'+esc(draft)+'" oninput="draft=this.value" onkeydown="if(event.key===\'Enter\')logText()" placeholder="e.g. 2 white bread, 1 fried egg" style="margin:0"><button onclick="logText()">Log</button></div>'+
 (busy?'<p><span class="spin"></span>'+busy+'</p>':'')+(errTxt?'<div class="err">'+esc(errTxt)+'</div>':'')+
 '<label class="btn sec full" style="margin-top:10px">Scan with camera<input type="file" accept="image/*" capture="environment" hidden onchange="scan(this)"></label></div>'+pend+diary+
 (rec?'<details class="card"'+(recOpen?' open':'')+' ontoggle="recOpen=this.open"><summary><b>Recent foods</b></summary><div style="margin-top:8px">'+rec+'</div></details>':'')
}

function weekWalk(){
 var n=0,d=new Date()
 for(var i=0;i<7;i++){
  var k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
  n+=S.walk[k]||0
  d.setDate(d.getDate()-1)
 }
 return n
}
function logWalk(m){
 var d=today()
 S.walk[d]=m===0?0:(S.walk[d]||0)+m
 save();draw()
}
function addWalk(){
 var v=Math.round(+$('#wm').value)
 if(v>0){logWalk(v)}
}
function toggleEdit(){editW=true;draw()}
function readEdits(){
 if(!editW){return}
 S.ex=S.ex.map(function(e,i){return {n:($('#en'+i)||{value:e.n}).value,d:($('#ed'+i)||{value:e.d}).value}})
 S.plan=S.plan.map(function(p,i){return ($('#pl'+i)||{value:p}).value})
}
function addEx(){readEdits();S.ex.push({n:'New exercise',d:'3 x 10'});save();draw()}
function delEx(i){readEdits();S.ex.splice(i,1);S.wk[today()]=[];save();draw()}
function saveEdits(){readEdits();editW=false;save();draw()}
function weighBanner(){
 if(new Date().getDay()!==S.wd){return ''}
 if(S.wt.some(function(x){return x.d===today()})){return ''}
 return '<div class="card" style="border-color:var(--acc)"><b>Weigh-in day</b><div class="note" style="margin:4px 0 8px">Same time, same conditions. Log it in the Me tab.</div><button class="full" onclick="tab=\'me\';draw()">Go to weight</button></div>'
}

function vWork(){
 var done=S.wk[today()]||[],dow=new Date().getDay(),list
 if(editW){
  list=S.ex.map(function(e,i){
   return '<div style="margin-bottom:10px"><input id="en'+i+'" value="'+esc(e.n)+'" placeholder="Exercise"><div class="row"><input id="ed'+i+'" value="'+esc(e.d)+'" placeholder="Sets, reps or time" style="margin:0"><button class="sec" onclick="delEx('+i+')">Delete</button></div></div>'
  }).join('')+'<button class="sec full" onclick="addEx()">+ Add exercise</button>'
 }else{
  list=S.ex.map(function(e,i){
   var d=done.indexOf(i)>-1
   return '<label class="ck'+(d?' d':'')+'"><input type="checkbox" '+(d?'checked':'')+' onchange="tick('+i+',this.checked)"><div>'+esc(e.n)+'<span>'+esc(e.d)+'</span></div></label>'
  }).join('')
 }
 var wk=S.plan.map(function(p,i){
  if(editW){return '<div class="item"><b style="min-width:96px">'+DAYS[i]+'</b><input id="pl'+i+'" value="'+esc(p)+'" style="margin:0"></div>'}
  return '<div class="item"><b'+(i===dow?' style="color:var(--acc)"':'')+'>'+DAYS[i]+'</b><span>'+esc(p)+'</span></div>'
 }).join('')
 return '<h1>Workout</h1><div class="sub">Today: '+esc(S.plan[dow])+' &middot; streak '+streak()+' day'+(streak()===1?'':'s')+'</div>'+
 '<div class="card"><div class="row sp"><h2>Routine</h2><button class="sec" style="padding:6px 14px" onclick="'+(editW?'saveEdits()':'toggleEdit()')+'">'+(editW?'Save':'Edit')+'</button></div>'+list+(editW?'':'<p class="note">'+done.length+' of '+S.ex.length+' done. Rest 30 seconds between sets. Go at a pace where you can still talk.</p>')+'</div>'+
 '<div class="card"><h2>Walking</h2><div class="big">'+(S.walk[today()]||0)+'<small>min today</small></div><div class="note" style="margin:6px 0 10px">Last 7 days: '+weekWalk()+' min</div><div class="row"><button class="sec" onclick="logWalk(10)">+10</button><button class="sec" onclick="logWalk(20)">+20</button><button class="sec" onclick="logWalk(30)">+30</button><button class="sec" onclick="logWalk(0)">Reset</button></div><div class="row" style="margin-top:8px"><input id="wm" type="number" inputmode="numeric" placeholder="Custom minutes" style="margin:0"><button onclick="addWalk()">Add</button></div></div>'+
 '<div class="card"><h2>Week plan</h2>'+wk+(editW?'<p class="note">Type anything: Full workout, 30 min walk, Rest.</p>':'')+'</div>'
}

function vCoach(){
 var msgs=S.chat.map(function(m){return '<div class="msg '+(m.r==='user'?'u':'a')+'">'+esc(m.t)+'</div>'}).join('')
 var sug=['Plan my meals for tomorrow','Am I on track today?','Craving matamis, what do I do?']
 return '<h1>Coach</h1><div class="sub">Knows your target, today\'s food and weight log.</div>'+
 (msgs||'<div class="card note">Ask anything: meal plans, cravings, what to eat after shift, workout swaps.</div>')+
 (busy?'<p><span class="spin"></span>'+busy+'</p>':'')+(errTxt?'<div class="err">'+esc(errTxt)+'</div>':'')+
 '<textarea id="q" rows="2" placeholder="Message your coach"></textarea><div class="row"><button class="full" onclick="sendCoach()">Send</button><button class="sec" onclick="clearChat()">Clear</button></div>'+
 '<div style="margin-top:10px">'+sug.map(function(s){return '<button class="sec" style="margin:0 6px 6px 0;padding:8px 12px;font-size:14px" onclick="document.getElementById(\'q\').value=this.textContent">'+s+'</button>'}).join('')+'</div>'
}

function vMe(){
 var w=S.wt.slice(-8).reverse().map(function(x){return '<div class="item"><b>'+x.v+' kg</b><span>'+x.d+'</span></div>'}).join('')||'<div class="note">No weigh-ins yet.</div>'
 return '<h1>Me</h1><div class="sub">34 &middot; 5\'5" &middot; night shift</div>'+
 '<div class="card"><h2>Weight</h2><div class="row"><input id="wv" type="number" step="0.1" inputmode="decimal" placeholder="kg today"><button style="margin-bottom:8px" onclick="logWeight()">Log</button></div>'+weightChart()+w+'<p class="note">Weigh once a week on your weigh-in day, same time and same conditions.</p></div>'+
 '<div class="card"><h2>Targets and AI</h2><label class="note">Calories per day</label><input id="sc" type="number" value="'+S.set.kcal+'"><label class="note">Protein g per day</label><input id="sp" type="number" value="'+S.set.prot+'">'+
 '<label class="note">Weigh-in day</label><select id="sw">'+DAYS.map(function(d,i){return '<option value="'+i+'"'+(i===S.wd?' selected':'')+'>'+d+'</option>'}).join('')+'</select>'+
 '<label class="note">Anthropic API key</label><input id="sk" type="password" value="'+esc(S.set.key)+'" placeholder="sk-ant-..."><label class="note">Model</label><input id="sm" value="'+esc(S.set.model)+'">'+
 '<button class="full" onclick="saveSet()">Save</button>'+(errTxt?'<div class="err">'+esc(errTxt)+'</div>':'')+'<p class="note">Your key stays on this phone only. Food photos go straight to Anthropic for the estimate.</p></div>'+
 '<div class="card"><h2>Backup</h2><button class="sec full" onclick="copyBackup()">Copy my data</button><textarea id="bk" rows="3" placeholder="Paste backup here to restore" style="margin-top:8px"></textarea><button class="sec full" onclick="restoreBackup()">Restore from paste</button><p class="note">Includes your API key, so keep it private. Paste it into Notes.</p></div>'
}

function draw(){
 var v=$('#v'),keep=document.activeElement&&document.activeElement.id,val=keep&&document.activeElement.value
 v.innerHTML={today:vToday,workout:vWork,coach:vCoach,hist:vHist,me:vMe}[tab]()
 document.querySelectorAll('#nav button').forEach(function(b){b.className=b.dataset.t===tab?'on':''})
 if(keep&&$('#'+keep)&&val){$('#'+keep).value=val}
}
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;errTxt='';draw();window.scrollTo(0,0)}})
draw()
fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
 var m=t.match(/var VER=(\d+)/)
 if(m&&+m[1]>VER){location.replace(location.pathname+'?v='+m[1])}
}).catch(function(){})
// #!/mng.ui
</script>
</body>
</html>
